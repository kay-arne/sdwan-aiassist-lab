# Demo-scenario's voor de cockpit. Elk scenario: een verhaal, acties die het veroorzaken (impair, traffic,
# vm, iperf, fmg_script, sleep) en de FortiAI-Assist-vragen die je daarna stelt in FortiAnalyzer of
# FortiManager. 'clear' zet het lab weer in de basisstand.
#
# Actiesoorten:
#   {do: impair, site: br1, transport: A|B, delay: ms, jitter: ms, loss: pct, rate: mbit}
#   {do: link, site: br2, transport: A, state: down|up}
#   {do: clear}                                       alle links schoon en alle hubs aan
#   {do: traffic, site: all|br1|.., preset: normal|streaming|security|voice}
#   {do: traffic_stop}
#   {do: vm, site: hub-ams, op: stop|start}
#   {do: iperf, site: br1, to: srv-ams, seconds: 20, streams: 4}
#   {do: fmg_script, device: FGT-BR1, name: .., content: ".."}
#   {do: sleep, seconds: 30}

traffic_presets:
  # Achtergrondverkeer: start automatisch na de uitrol en blijft draaien, zodat FortiAnalyzer altijd een mix aan logs heeft:
  # zakelijk (Office 365, Teams/Zoom, SaaS), streaming/social, en een klein deel ongewenst (webfilter, malware, IOC/botnet).
  background: {office365: 20, collab: 12, streaming: 18, social: 8, saas: 10, web: 10, updates: 4, download: 3, sdwan: 3, webfilter: 5, malware: 4, ioc: 3, dc: 12, branch: 3}
  normal:    {office365: 25, collab: 20, streaming: 20, social: 10, saas: 10, web: 10, updates: 3, download: 2, sdwan: 5, webfilter: 0, malware: 0, ioc: 0, dc: 8, branch: 2}
  streaming: {office365: 5, collab: 5, streaming: 70, social: 15, saas: 0, web: 5, updates: 0, download: 0, sdwan: 5, webfilter: 0, malware: 0, ioc: 0}
  voice:     {office365: 15, collab: 70, streaming: 0, social: 0, saas: 10, web: 0, updates: 0, download: 0, sdwan: 5, webfilter: 0, malware: 0, ioc: 0}
  security:  {office365: 10, collab: 5, streaming: 5, social: 5, saas: 5, web: 10, updates: 0, download: 0, sdwan: 5, webfilter: 15, malware: 25, ioc: 15}

scenarios:
  - id: baseline
    title: "1. Basislijn: wat gebeurt er in mijn SD-WAN?"
    story: >
      Alle links gezond, normaal gebruikersverkeer in drie branches. Je laat zien wat FortiAnalyzer nu al weet
      (applicaties, bandbreedte per underlay, SLA-metingen) en hoe FortiAI-Assist daar in gewone taal vragen over
      beantwoordt, zonder dat je een filter of dashboard hoeft te kennen.
    setup:
      - {do: clear}
      - {do: traffic, site: all, preset: normal}
      - {do: sleep, seconds: 120}
    fortiai:
      - {where: FortiAnalyzer, prompt: "Show top applications by bytes, past hour.", expect: "Log-analyse met filter; tabel uit FortiAnalyzer-data (SQL achter de schermen)"}
      - {where: FortiAnalyzer, prompt: "Generate a bar chart of the top 10 applications by session count, past hour.", expect: "Staafdiagram met applicaties; open eerst Log View (FortiAI werkt op de huidige pagina)"}
      - {where: FortiAnalyzer, prompt: "Generate a pie chart of sessions by outgoing interface, past hour.", expect: "Verdeling over port2 (underlay A), port3 (underlay B) en tunnels"}
      - {where: FortiAnalyzer, prompt: "What can you help me with?", expect: "FortiAI somt zijn taken op: loganalyse, grafieken, event handlers, incidenten"}
    cleanup: []

  - id: brownout
    title: "2. Brownout op underlay A van Utrecht"
    story: >
      De internetlink van branch Utrecht wordt traag en verliest pakketten (150 ms, 40 ms jitter, 6% verlies). De
      SLA-health-check faalt en SD-WAN verplaatst Teams en de ERP-verbindingen naar underlay B. Gebruikers merken
      weinig; de beheerder wil weten wat er gebeurde en waarom.
    setup:
      - {do: clear}
      - {do: traffic, site: br1, preset: voice}
      - {do: sleep, seconds: 60}
      - {do: impair, site: br1, transport: A, delay: 150, jitter: 40, loss: 6}
      - {do: sleep, seconds: 120}
    fortiai:
      - {where: FortiAnalyzer, prompt: "Show SD-WAN SLA events for FGT-BR1, past 30 minutes.", expect: "Loganalyse op SD-WAN-logs (SLA-wissels, health-check DC_SLA)"}
      - {where: FortiAnalyzer, prompt: "Filter traffic logs for FGT-BR1, application Microsoft.Teams, past hour. Which interface was used?", expect: "Sessies eerst over port2, na de impairment over port3 (appnaam hangt van de signature af)"}
      - {where: FortiAnalyzer, prompt: "Generate a bar chart of sessions per outgoing interface for FGT-BR1, past hour.", expect: "Grafiek laat het verschuiven van underlay A naar B zien"}
      - {where: FortiManager, prompt: "VPN Assistant: check the status of all IPsec tunnels on FGT-BR1.", expect: "VPN Assistant: kies FGT-BR1 in de widget; tunnels over underlay A vertraagd of down, VPN2 gezond"}
    cleanup:
      - {do: clear}

  - id: blackout
    title: "3. Underlay A valt weg in Rotterdam"
    story: >
      De volledige internetlink van branch Rotterdam gaat down. De IPsec-tunnels over underlay A vallen weg, BGP
      herconvergeert via underlay B, en ADVPN bouwt zo nodig nieuwe shortcuts. Het gaat erom hoe snel en wat de
      impact was.
    setup:
      - {do: clear}
      - {do: traffic, site: br2, preset: normal}
      - {do: sleep, seconds: 60}
      - {do: link, site: br2, transport: A, state: down}
      - {do: sleep, seconds: 90}
    fortiai:
      - {where: FortiAnalyzer, prompt: "Show VPN tunnel down events for FGT-BR2, past 15 minutes.", expect: "Tunnel-down-events (HUB1-VPN1, HUB2-VPN1)"}
      - {where: FortiAnalyzer, prompt: "Create an event handler for IPsec tunnel down events on FGT-BR2.", expect: "FortiAI vraagt één bevestiging: antwoord \"Yes\"; er opent een venster met de regel, klik Create"}
      - {where: FortiManager, prompt: "VPN Assistant: diagnose the IPsec tunnels on FGT-BR2.", expect: "VPN Assistant: kies FGT-BR2; tunnels over underlay A down, samenvatting van mogelijke oorzaken"}
    cleanup:
      - {do: clear}

  - id: hub-failure
    title: "4. Hub Amsterdam valt uit"
    story: >
      Het hele datacenter AMS (inclusief FortiGate-hub) valt uit. Spokes routeren via Frankfurt. Je laat zien dat de
      multi-hub-overlay werkt en dat FortiAnalyzer de impact per branch kan reconstrueren.
    setup:
      - {do: clear}
      - {do: traffic, site: all, preset: normal}
      - {do: sleep, seconds: 60}
      - {do: vm, site: hub-ams, op: stop}
      - {do: sleep, seconds: 120}
    fortiai:
      - {where: FortiAnalyzer, prompt: "Show VPN tunnel down events for FGT-BR1, past 10 minutes.", expect: "Per spoke de HUB1-tunnels (6 in totaal)"}
      - {where: FortiAnalyzer, prompt: "Generate a pie chart of sessions by outgoing interface, past hour.", expect: "Verkeer is naar de tunnels van HUB2 verschoven"}
      - {where: FortiManager, prompt: "VPN Assistant: check the status of all IPsec tunnels on FGT-BR1.", expect: "VPN Assistant: kies een spoke; HUB1-tunnels down, HUB2-tunnels up"}
    cleanup:
      - {do: vm, site: hub-ams, op: start}
      - {do: clear}

  - id: streaming-vs-business
    title: "5. Streaming concurreert met bedrijfsapplicaties"
    story: >
      In Eindhoven start een stroom streaming. De rule STREAMING stuurt dat naar de goedkoopste link (underlay B) en
      houdt underlay A schoon voor Teams en Salesforce. Je laat zien dat business intent het verkeer sorteert.
    setup:
      - {do: clear}
      - {do: traffic, site: br3, preset: streaming}
      - {do: sleep, seconds: 180}
    fortiai:
      - {where: FortiAnalyzer, prompt: "Show top 5 applications by bytes for FGT-BR3, past hour.", expect: "Netflix / streaming bovenaan"}
      - {where: FortiAnalyzer, prompt: "Generate a pie chart of sessions by outgoing interface for FGT-BR3, past hour.", expect: "Streaming op port3 (underlay B), conform rule STREAMING"}
      - {where: FortiManager, prompt: "Script Assistant: Write a FortiGate CLI script, vdom root. Under config system sdwan, config service, create rule id 20 named SPOTIFY: internet-service enable, internet-service-name Spotify-Spotify, mode priority, priority-members 2. Output only the script.", expect: "Script Assistant: CLI; Save Script of Save CLI Template; review voor uitvoeren"}
    cleanup:
      - {do: traffic_stop}

  - id: security-incident
    title: "6. Beveiligingsincident: malware en botnet-gedrag"
    story: >
      Een host in Rotterdam begint harmloze testmalware (EICAR) op te halen en doet DGA-/tunnel-DNS-queries. De FortiGate
      blokkeert (AV, IPS, DNS-filter), FortiAnalyzer correleert tot een incident, en FortiAI-Assist legt uit wat er gebeurde
      en wat de aanbevolen vervolgstappen zijn.
    setup:
      - {do: clear}
      - {do: traffic, site: br2, preset: security}
      - {do: sleep, seconds: 240}
    fortiai:
      - {where: FortiAnalyzer, prompt: "Show top threats for FGT-BR2, past hour.", expect: "Adressen plus korte analyse en mitigatie-advies"}
      - {where: FortiAnalyzer, prompt: "Perform a security reputation check for <IP uit het vorige antwoord>.", expect: "Reputatie via FortiGuard en VirusTotal (internet nodig); vraag daarna om mitigatie"}
      - {where: FortiAnalyzer, prompt: "Generate a pie chart of source IPs for FGT-BR2 traffic, past hour.", expect: "Taartdiagram met Traffic-Gen-bronnen 10.12.0.50-55"}
      - {where: FortiAnalyzer, prompt: "Create an event handler for web filter blocks on FGT-BR2.", expect: "Event handler met naam en regelsamenvatting"}
      - {where: FortiAnalyzer, prompt: "List incidents created in the past 24 hours.", expect: "Incidenten uit event handlers (kan leeg zijn); vraag door naar details en affected endpoints"}
      - {where: FortiAnalyzer, prompt: "Produce an incident report for incident <nummer>.", expect: "Rapport met download-icoon in het antwoord"}
    cleanup:
      - {do: traffic_stop}

  - id: throughput
    title: "7. Overlay-doorvoer en bandbreedte-hogs"
    story: >
      Een iperf3-test van Utrecht naar de AMS-server over de overlay vult de link; je kijkt naar de impact op andere verkeer
      en laat FortiAI de bandbreedte-verbruikers benoemen.
    setup:
      - {do: clear}
      - {do: traffic, site: br1, preset: normal}
      - {do: iperf, site: br1, to: srv-ams, seconds: 60, streams: 4}
    fortiai:
      - {where: FortiAnalyzer, prompt: "Show top destinations by bytes for FGT-BR1, past 15 minutes.", expect: "10.21.0.10 (iperf3, poort 5201) bovenaan"}
      - {where: FortiAnalyzer, prompt: "Show the 5 largest sessions by bytes sent for FGT-BR1, past 15 minutes.", expect: "De iperf3-sessie (poort 5201) staat bovenaan"}
    cleanup:
      - {do: traffic_stop}

  - id: config-assist
    title: "8. Scripts en VPN met FortiAI in FortiManager"
    story: >
      Geen verstoring: FortiAI in FortiManager via de Script Assistant en de VPN Assistant. Kies eerst de assistent bovenin het FortiAI-venster.
    setup:
      - {do: clear}
    fortiai:
      - {where: FortiManager, prompt: "Script Assistant: Create firewall addresses for 10.2.2.1 and awesome-service.com.", expect: "Script met twee adressen; Copy Code, Save Script, Save CLI Template"}
      - {where: FortiManager, prompt: "Script Assistant: Write a FortiGate CLI script, vdom root. Under config system sdwan, config service, create rule id 21 named ZOOM: internet-service enable, internet-service-name Zoom.us-Zoom.Meeting, mode sla, health-check DC_SLA. Output only the script.", expect: "CLI voor config system sdwan / service; review voor uitvoeren"}
      - {where: FortiManager, prompt: "VPN Assistant: Help me configure site-to-site VPN.", expect: "Kies Select Devices (of upload topologie-afbeelding, max 5 MB); controleer samenvatting; PSK handmatig aanpassen"}
      - {where: FortiManager, prompt: "VPN Assistant: check the status of all IPsec tunnels on FGT-BR1.", expect: "Widget: kies FGT-BR1 en Confirm; rapport van de tunnels"}
      - {where: FortiManager, prompt: "VPN Assistant: diagnose the IPsec tunnels on FGT-BR1.", expect: "Diagnose met samenvatting; vraag om oplossing, installeer en controleer opnieuw"}
      - {where: FortiManager, prompt: "IoT Device Analysis: What do I need to do to detect IoT devices through my FortiGates?", expect: "Alleen uitleg van vereisten; dit lab heeft geen IoT-apparaten"}
    cleanup: []

  - id: reporting
    title: "9. Rapportage en SLA-bewijs"
    story: >
      Management wil een SLA-overzicht per branch. Met FortiAI vraag je de data op en laat je een rapportstructuur voorstellen.
    setup:
      - {do: clear}
      - {do: traffic, site: all, preset: normal}
      - {do: sleep, seconds: 120}
    fortiai:
      - {where: FortiAnalyzer, prompt: "Generate a bar chart of the top 10 applications by session count, past 24 hours.", expect: "Management-grafiek; download via Download Chat History (HTML/PNG)"}
      - {where: FortiAnalyzer, prompt: "Generate a pie chart of the top 10 source IPs by session count, past 24 hours.", expect: "Verdeling over de Traffic-Gen-bronnen"}
      - {where: FortiAnalyzer, prompt: "Generate report: SD-WAN for FGT-BR1, FGT-BR2, FGT-BR3, past 24 hours.", expect: "Bestaande sjablonen; een vage vraag (bijv. PCI-rapport) kost extra tokens"}
    cleanup:
      - {do: traffic_stop}

  - id: faz-demo
    title: "10. Demo FortiAnalyzer: incident onderzoeken en reageren"
    story: >
      Een incident ophalen, de verdachte publieke IP controleren, kijken welke endpoints geraakt zijn, doorklikken naar Threat Hunting
      en Log View, het incident afronden, een event handler en een rapport maken, en visualiseren.
    setup:
      - {do: clear}
      - {do: traffic, site: br2, preset: security}
      - {do: sleep, seconds: 240}
    fortiai:
      - {where: FortiAnalyzer, prompt: "Please help fetch the latest incident.", expect: "Incidentdetails met het getroffen IP (er moet een incident bestaan: maak er een in Incidents & Events vanuit een event)"}
      - {where: FortiAnalyzer, prompt: "Check the reputation of <publiek IP uit het incident>.", expect: "Reputatie via FortiGuard en VirusTotal (internet nodig); vraag daarna om mitigatie-advies"}
      - {where: FortiAnalyzer, prompt: "Show top source IPs by sessions for FGT-BR2, past hour.", expect: "Log-analyse: andere bronnen die naar dezelfde bestemming praten (hier de Traffic-Gen-bronnen 10.12.0.5x)"}
      - {where: FortiAnalyzer, prompt: "Open Threat Hunting.", expect: "FortiAI opent de pagina zonder dat je het gesprek verlaat"}
      - {where: FortiAnalyzer, prompt: "Open Log View.", expect: "FortiAI opent Log View vanuit het gesprek"}
      - {where: FortiAnalyzer, prompt: "Update the incident and hand off.", expect: "Notitie en status aan het incident; ruimt de overdracht op"}
      - {where: FortiAnalyzer, prompt: "Generate an incident report for <incidentnummer>.", expect: "Rapport met download-icoon in het antwoord"}
      - {where: FortiAnalyzer, prompt: "Create an event handler for IPsec tunnel down events on FGT-BR2.", expect: "Antwoord \"Yes\" op de bevestigingsvraag; er opent een venster met de regel, klik Create"}
      - {where: FortiAnalyzer, prompt: "Can FortiAnalyzer generate a visual on threats?", expect: "FortiAI legt uit wat het kan renderen"}
      - {where: FortiAnalyzer, prompt: "What type of charts can be rendered?", expect: "Antwoord: taartdiagram en staafdiagram (ook gegroepeerd/gestapeld)"}
      - {where: FortiAnalyzer, prompt: "Generate a pie chart of source IPs connected to <publiek IP>.", expect: "Taartdiagram met de bronnen"}
    cleanup:
      - {do: traffic_stop}

  - id: fmg-demo
    title: "11. Demo FortiManager: VPN Assistant, Script Assistant en IoT"
    story: >
      Eerst de IoT-voorwaarden, dan de VPN Assistant (configureren, tunnelstatus, diagnose), dan de Script Assistant met meta variables
      en opslaan als CLI-template.
    setup:
      - {do: clear}
    fortiai:
      - {where: FortiManager, prompt: "IoT Device Analysis: What do I need to do to enable the IoT vulnerability function on my FortiGates?", expect: "Lijst van voorwaarden: licenties (Device Detection, Security Rating), FortiGuard, device detection op de interface"}
      - {where: FortiManager, prompt: "IoT Device Analysis: Check the prerequisites for my FortiGates.", expect: "Widget: kies de FortiGates; het resultaat toont dat dit lab er niet aan voldoet (geen device detection); goed om de nauwkeurigheid te laten zien"}
      - {where: FortiManager, prompt: "VPN Assistant: What can the VPN configuration assistant do?", expect: "Site-to-site, dial-up en tunnelcontrole/diagnose"}
      - {where: FortiManager, prompt: "VPN Assistant: Create a site-to-site VPN. I would like to select devices.", expect: "Kies Select Devices (of upload een topologie-afbeelding, max 5 MB); controleer de samenvatting en bevestig; je krijgt een script per FortiGate"}
      - {where: FortiManager, prompt: "VPN Assistant: check the status of all IPsec tunnels on FGT-BR1.", expect: "Widget: kies FGT-BR1 en Confirm"}
      - {where: FortiManager, prompt: "VPN Assistant: diagnose the IPsec tunnels on FGT-BR1.", expect: "Diagnose met samenvatting van de problemen (na het wegvallen van WAN-A)"}
      - {where: FortiManager, prompt: "VPN Assistant: fix the detected VPN issues on FGT-BR1.", expect: "FortiAI stelt een oplossing voor; installeer daarna via de wizard en controleer de status opnieuw"}
      - {where: FortiManager, prompt: "Script Assistant: What can the CLI script assistant do?", expect: "Uitleg: CLI- en Jinja-scripts, meta variables"}
      - {where: FortiManager, prompt: "Script Assistant: Write a FortiGate CLI script, vdom root. Set system global hostname to enterprise_branch_$(branch_id) and system interface port4 ip to 10.101.$(branch_id).1/24, where branch_id is a FortiManager meta variable. Output only the script.", expect: "Script met $(branch_id); Save CLI Template. Laat het script alleen zien, installeer het niet op de lab-FortiGates"}
    cleanup:
      - {do: clear}
