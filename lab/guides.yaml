# Labguides: verhaal + knoppen + FortiAI-prompts per hoofdstuk, getoond onder het tabblad "Labguides".
# Stappen:
#   {text: ".."}                                     uitleg (**vet** en `code` mogelijk)
#   {buttons: [{label, action: {do: ..}}]}           acties uit scenarios.yaml (impair, link, clear, traffic, traffic_stop, vm, iperf)
#   {buttons: [{label, check: health|links, device}]}  toont live SD-WAN-status in de guide
#   {ai: all | [0, 2]}                               FortiAI-prompts van het scenario (kopieerknop)
#   {tip: ".."}                                      hint
#   {access: true} {fortiai_status: true} {docs: true}   inline blokken (alleen in 'start')
guides:
  - id: start
    title: "Aan de slag"
    summary: "Toegang tot de platformen, FortiAI-status en achtergrondverkeer"
    steps:
      - text: >
          Dit lab bouwt een SD-WAN met **2 hubs** (Amsterdam, Frankfurt, onderling verbonden met IPsec-tunnels en iBGP) en **3 branches** (Utrecht, Rotterdam,
          Eindhoven) met **ADVPN 2.0** voor directe tunnels tussen branches, beheerd met templates
          vanuit **FortiManager** en gelogd naar **FortiAnalyzer**. **Traffic-Gen** in elke branch genereert verkeer; **FortiAI-Assist**
          in FortiManager en FortiAnalyzer beantwoordt vragen over wat er gebeurt. Elk hoofdstuk hiernaast is een demo met knoppen om
          de situatie te veroorzaken en de vragen die je daarna stelt.
      - image: fmg-overlay.jpg
        caption: "FortiManager > SD-WAN Manager > Overlay Orchestration: de overlay LAB-OVERLAY (twee hubs, spokes via groep SPOKES, BGP AS 65000) is vanuit één template uitgerold."
      - image: fmg-vpnmap.jpg
        caption: "FortiManager > VPN Manager > IPsec VPN Map: de FortiGates staan op hun (fictieve) locaties, hubs in Amsterdam en Frankfurt en de branches in Utrecht, Rotterdam en Eindhoven, verbonden door de overlay-tunnels."
      - text: >
          **Stap 1: inloggen.** De adressen en inloggegevens van alle onderdelen open je op elk moment met de knop **Toegang** linksboven
          in deze guide.
      - access: true
      - text: >
          **Stap 2: achtergrondverkeer.** Na de uitrol draait er continu een mix van zakelijk verkeer, streaming en ongewenst verkeer (webfilter,
          malware, botnet-DNS). Laat het lab minstens 30 minuten draaien voordat je FortiAI vragen stelt: hoe meer logs, hoe beter de antwoorden.
      - buttons:
          - {label: "Achtergrondverkeer starten", action: {do: traffic, site: all, preset: background}}
          - {label: "Verkeer stoppen", action: {do: traffic_stop, background: false}}
          - {label: "Alles herstellen", action: {do: clear}}
      - text: "**Stap 3: FortiAI klaar?** Controleer of FortiManager en FortiAnalyzer een FortiAI-contract hebben en internet bereiken."
      - fortiai_status: true
      - tip: >
          FortiAI werkt alleen met een lokale administrator, een FortiAI-licentie (maandelijks tokenbudget, gedeeld) en uitgaand internet vanaf port1.
          Houd prompts kort en vraag met tijdvenster; start na ongeveer 10 vragen een nieuwe thread.
      - tip: >
          **Uit de officiële demo-guides:** pas de demo aan op het publiek (SOC-analist: incidentprioriteit en minder alarmoverload; NOC-engineer:
          scripts en VPN; manager of CISO: efficiëntie en compliance). Per platform mogen maximaal 3 gebruikers FortiAI gebruiken en het
          maandelijkse tokenbudget is vast. Antwoorden verschillen in woordkeuze maar niet in uitkomst. Het gaat om assisteren, niet vervangen:
          de mens blijft de beslissingen nemen.
      - tip: >
          **Eerst naar de juiste pagina.** FortiAI in FortiAnalyzer werkt in de context van de huidige pagina: open voor logvragen en grafieken eerst
          **Log View > Traffic** (of Event Monitor), anders vraagt FortiAI om je door te sturen. Groepeer grafieken op iets dat betekenis heeft
          (applicatie, bron-IP, interface); per FortiGate toont FortiAI serienummers in plaats van namen.
      - text: "**Naslag**"
      - docs: true

  - id: baseline
    title: "1. Basislijn"
    scenario: baseline
    summary: "Alles gezond: wat weet FortiAnalyzer al?"
    steps:
      - text: >
          Alle links zijn gezond en er loopt normaal gebruikersverkeer. Je laat zien wat FortiAnalyzer al weet en hoe FortiAI daar in gewone
          taal vragen over beantwoordt, zonder filtersyntax of dashboards.
      - buttons:
          - {label: "Links en hubs herstellen", action: {do: clear}}
          - {label: "Normaal verkeer op alle branches", action: {do: traffic, site: all, preset: normal}}
      - tip: "Laat het verkeer 5-10 minuten draaien, of gebruik het achtergrondverkeer als dat al langer loopt."
      - image: faz-logview.jpg
        caption: "FortiAnalyzer > Log View > Traffic: echte gebruikerssessies per branch (Microsoft Teams, Outlook, Facebook, Apple Updates) naast de PING-probes van de SD-WAN health-check."
      - image: faz-topapps.jpg
        caption: "FortiView > Applications: het applicatiebeeld van het laatste uur. Dit is de data waar FortiAI straks op antwoordt; let ook op de kritieke app Proxy.Websites."
      - buttons:
          - {label: "ISP-links bekijken", check: links}
          - {label: "SD-WAN health-check Utrecht", check: health, device: FGT-BR1}
      - text: "**Vraag het FortiAI.** Open FortiAI in FortiAnalyzer (icoon in de banner)."
      - ai: all

  - id: brownout
    title: "2. Brownout op underlay A"
    scenario: brownout
    summary: "Slechte link: SLA faalt, SD-WAN stuurt verkeer weg"
    steps:
      - text: >
          De internetlink van Utrecht (WAN-A) wordt traag en verliest pakketten: 150 ms, 40 ms jitter, 6% verlies. De SLA van health-check
          `DC_SLA` (80 ms / 20 ms / 2%) faalt, en de rules VOICE-VIDEO en BUSINESS-SAAS verplaatsen verkeer naar underlay B.
      - buttons:
          - {label: "1. Voice-verkeer in Utrecht", action: {do: traffic, site: br1, preset: voice}}
      - text: "Wacht ongeveer een minuut zodat er een basislijn in de logs staat."
      - buttons:
          - {label: "2. Link verslechteren (WAN-A Utrecht)", action: {do: impair, site: br1, transport: A, delay: 150, jitter: 40, loss: 6}}
      - image: fmg-sdwan-monitor.jpg
        caption: "FortiManager > Device Manager > Monitors > SD-WAN Monitor (Table View): in de gezonde situatie staan links, SLA, applicaties en regels allemaal op groen. Tijdens de brownout zie je hier de SLA van Utrecht omslaan en de regels van link wisselen."
      - text: "Wacht twee minuten en kijk dan zelf wat SD-WAN doet:"
      - image: fmg-brownout.jpg
        caption: "Tijdens de brownout (150 ms, 40 ms jitter, 6% verlies) slaan SLA-status, applicaties en regels in de SD-WAN Monitor om naar oranje 'Attention Needed'; de tunnel HUB1-VPN1 van Utrecht krijgt een waarschuwing."
      - buttons:
          - {label: "SD-WAN health-check Utrecht", check: health, device: FGT-BR1}
          - {label: "ISP-links", check: links}
      - image: faz-sdwan-summary.jpg
        caption: "FortiAnalyzer > FortiView > SD-WAN: de SLA-problemen per interface en tunnel (hier met jitter bovenaan), gevoed door de SLA-logs van de FortiGates."
      - text: "**Vraag het FortiAI.**"
      - ai: all
      - buttons:
          - {label: "Opruimen: link herstellen", action: {do: clear}}

  - id: blackout
    title: "3. Underlay A valt weg"
    scenario: blackout
    summary: "Link down in Rotterdam: tunnels, BGP en failover"
    steps:
      - text: >
          De volledige link WAN-A van Rotterdam gaat down. De IPsec-tunnels over underlay A vallen weg, BGP herconvergeert en het verkeer gaat via
          underlay B. Het gaat erom hoe snel en wat de impact was.
      - buttons:
          - {label: "1. Normaal verkeer in Rotterdam", action: {do: traffic, site: br2, preset: normal}}
      - text: "Wacht een minuut."
      - buttons:
          - {label: "2. WAN-A Rotterdam down", action: {do: link, site: br2, transport: A, state: down}}
      - text: "Wacht ongeveer 90 seconden en bekijk de status:"
      - image: fmg-blackout.jpg
        caption: "SD-WAN Monitor tijdens de blackout: UNDERLAY-A (port2) van Rotterdam staat rood, de tunnels over die link zijn down en het verkeer loopt via UNDERLAY-B."
      - buttons:
          - {label: "SD-WAN health-check Rotterdam", check: health, device: FGT-BR2}
          - {label: "ISP-links", check: links}
      - text: "**Vraag het FortiAI.**"
      - ai: all
      - buttons:
          - {label: "Opruimen: link weer up", action: {do: clear}}

  - id: hub-failure
    title: "4. Hub Amsterdam valt uit"
    scenario: hub-failure
    summary: "Multi-hub: alle spokes schakelen naar Frankfurt"
    steps:
      - text: >
          Het datacenter Amsterdam, inclusief FortiGate-hub, valt uit. De spokes houden alleen de tunnels naar Frankfurt over en blijven
          daar bereikbaar; de servers in Amsterdam zelf zijn natuurlijk weg. De twee hubs zijn met elkaar verbonden (hub-naar-hub-tunnels met iBGP),
          dus in de normale situatie kennen beide hubs elkaars netwerken. Je laat zien dat de multi-hub-overlay werkt en dat de impact te reconstrueren is.
      - buttons:
          - {label: "1. Normaal verkeer overal", action: {do: traffic, site: all, preset: normal}}
      - text: "Wacht een minuut."
      - buttons:
          - {label: "2. Hub Amsterdam uitzetten", action: {do: vm, site: hub-ams, op: stop}}
      - text: "Wacht twee minuten."
      - image: fmg-hubfailure.jpg
        caption: "SD-WAN Monitor na de uitval van Amsterdam: nog 4 devices, de HUB1-tunnels van de branches staan rood en de HUB2-tunnels (Frankfurt) dragen het verkeer."
      - buttons:
          - {label: "SD-WAN health-check Utrecht", check: health, device: FGT-BR1}
      - text: "**Vraag het FortiAI.**"
      - ai: all
      - buttons:
          - {label: "Opruimen: hub weer aan", action: {do: vm, site: hub-ams, op: start}}
          - {label: "Alles herstellen", action: {do: clear}}

  - id: streaming-vs-business
    title: "5. Streaming tegenover bedrijfsapps"
    scenario: streaming-vs-business
    summary: "Business intent stuurt verkeer naar de juiste link"
    steps:
      - text: >
          In Eindhoven start een stroom streaming. De rule STREAMING stuurt die naar de goedkoopste link (underlay B), zodat underlay A schoon
          blijft voor Teams en Salesforce.
      - buttons:
          - {label: "Streaming-verkeer in Eindhoven", action: {do: traffic, site: br3, preset: streaming}}
      - text: "Wacht ongeveer drie minuten."
      - buttons:
          - {label: "SD-WAN health-check Eindhoven", check: health, device: FGT-BR3}
      - text: "**Vraag het FortiAI.** De laatste vraag gebruikt de Script Assistant in FortiManager."
      - ai: all
      - buttons:
          - {label: "Opruimen", action: {do: traffic_stop}}

  - id: security-incident
    title: "6. Beveiligingsincident"
    scenario: security-incident
    summary: "Malware en botnet-DNS: van logs naar incident"
    steps:
      - text: >
          Een host in Rotterdam haalt testmalware (EICAR) op en doet DGA/tunnel-DNS-queries. De FortiGate blokkeert (AV, IPS, DNS-filter);
          FortiAnalyzer correleert tot events en incidenten. Met FortiAI loop je door: dreigingen opvragen, reputatiecheck, grafiek, event handler,
          incidentrapport.
      - buttons:
          - {label: "Aanvalsverkeer in Rotterdam", action: {do: traffic, site: br2, preset: security}}
      - text: "Wacht minstens vier minuten, bij voorkeur langer."
      - image: faz-eventmonitor.jpg
        caption: "Incidents & Events > Event Monitor: FortiAnalyzer heeft de aanvalssessies al omgezet naar events (kritieke risicovolle app, proxy-avoidance, kwaadaardige website geblokkeerd) per bronhost."
      - tip: "Vragen met <IP> of <nummer> vul je in met het resultaat van de vorige vraag in dezelfde thread."
      - ai: all
      - buttons:
          - {label: "Opruimen", action: {do: traffic_stop}}

  - id: throughput
    title: "7. Doorvoer en bandbreedte"
    scenario: throughput
    summary: "iperf3 over de overlay en de grootste verbruikers"
    steps:
      - text: "Een iperf3-test van Utrecht naar de server in Amsterdam vult de link; je laat FortiAI de bandbreedte-verbruikers benoemen."
      - buttons:
          - {label: "1. Normaal verkeer in Utrecht", action: {do: traffic, site: br1, preset: normal}}
          - {label: "2. iperf3 Utrecht naar AMS (60 s)", action: {do: iperf, site: br1, to: srv-ams, seconds: 60, streams: 4}}
      - image: fmg-throughput.jpg
        caption: "SD-WAN Monitor tijdens de iperf3-test: de belasting laat de SLA van de HUB1-tunnels van Utrecht omslaan naar 'Attention Needed' en de internetlinks dragen meer dan 700 kbps."
      - text: "Wacht tot de test klaar is (zie Joblog) en vraag dan:"
      - ai: all
      - buttons:
          - {label: "Opruimen", action: {do: traffic_stop}}

  - id: config-assist
    title: "8. Scripts en VPN met FortiAI"
    scenario: config-assist
    summary: "Script Assistant en VPN Assistant in FortiManager"
    steps:
      - text: >
          Geen verstoring: FortiAI in FortiManager als co-pilot. Open FortiAI in FortiManager en **kies eerst de assistent** bovenin het venster
          (Script Assistant, VPN Assistant of IoT Device Analysis).
      - tip: >
          **Eerste keer:** open je FortiAI in FortiManager voor het eerst, dan vraagt de assistent of je jezelf als FortiAI-gebruiker wilt inschakelen
          (knop **Enable FortiAI for Myself**). Dat is een instelling op je admin-account; bevestig die één keer.
      - buttons:
          - {label: "Alles herstellen", action: {do: clear}}
      - tip: "Gegenereerde scripts bewaar je met Save Script (Device Manager > Scripts); controleer ze altijd voordat je ze uitvoert. De PSK in een VPN-script pas je handmatig aan."
      - ai: all

  - id: reporting
    title: "9. Rapportage en SLA-bewijs"
    scenario: reporting
    summary: "Grafieken en rapporten voor management"
    steps:
      - text: "Management wil een overzicht per branch. Met FortiAI genereer je grafieken en een rapport."
      - buttons:
          - {label: "Normaal verkeer op alle branches", action: {do: traffic, site: all, preset: normal}}
      - image: faz-countries.jpg
        caption: "FortiView > Traffic > Top Country/Region: sessies, bytes en threat score per bestemmingsland, een mooi vertrekpunt voor een managementrapport."
      - text: "Laat het verkeer even lopen (liefst veel langer) en vraag dan:"
      - ai: all
      - buttons:
          - {label: "Opruimen", action: {do: traffic_stop}}

  - id: faz-demo
    title: "10. Demo FortiAnalyzer"
    scenario: faz-demo
    summary: "Incident, reputatie, event handler, rapport en grafiek"
    steps:
      - text: >
          **Het verhaal.** MIS meldt een trage server aan de SOC. Er is een incident aangemaakt in FortiAnalyzer en een analist onderzoekt het met de
          AI-assistent. Je laat zien dat FortiAI informatie uit meerdere plekken verzamelt, context geeft en de analist laat doorvragen.
      - text: "**Start het scenario**: aanvalsverkeer vanuit Rotterdam. Wacht minstens vier minuten, liefst langer."
      - buttons:
          - {label: "Aanvalsverkeer in Rotterdam", action: {do: traffic, site: br2, preset: security}}
      - tip: "Voor stap 1 heb je een incident nodig: maak er een in **Incidents & Events** vanuit een security-event."
      - image: faz-eventmonitor.jpg
        caption: "Vanuit de Event Monitor maak je het incident aan (Actions > Create Incident) waar FortiAI mee verder gaat."
      - text: "**Deel 1: incident onderzoeken**"
      - ai: [0, 1, 2, 3, 4]
      - text: "**Wat je benadrukt:** informatie uit meerdere plekken in één gesprek, context (dreigingsinfo en getroffen assets) in seconden, en doorvragen om de zaak te verfijnen. Richtwaarde: AI gemiddeld 3 minuten, handmatig gemiddeld 48 minuten."
      - text: "**Deel 2: afronden en rapporteren**"
      - ai: [5, 6]
      - text: "**Wat je benadrukt:** een incidentrapport met het volledige onderzoek voor nabespreking en compliance."
      - text: "**Deel 3: aangepaste detectieregel**"
      - ai: [7]
      - text: "**Wat je benadrukt:** een detectieregel maken kost een paar zinnen in plaats van handmatig regels bouwen, en de regels zijn afgestemd op de omgeving."
      - text: "**Deel 4: rapport en visualisatie**"
      - image: faz-fortiai-chart.jpg
        caption: "FortiAI in FortiAnalyzer: een taartdiagram van de top 10 applicaties, gegenereerd uit één zin. Rechtsonder staat het resterende maandelijkse tokenbudget."
      - ai: [8, 9, 10]
      - text: "**Wat je benadrukt:** de gebruiker kiest bronnen, parameters en diagramtype in een begeleid proces; minder handwerk voor rapportages."
      - buttons:
          - {label: "Opruimen", action: {do: traffic_stop}}

  - id: fmg-demo
    title: "11. Demo FortiManager"
    scenario: fmg-demo
    summary: "Officiële demoflow: IoT, VPN Assistant, Script Assistant"
    steps:
      - text: >
          **Het verhaal.** Het bedrijf breidt uit en het NOC moet snel VPN's inrichten, tunnels bewaken en veel FortiGates provisionen. Open FortiAI in
          FortiManager en **kies steeds eerst de juiste assistent** bovenin het venster (IoT, VPN of Script).
      - text: "**Deel 1: IoT-voorwaarden.** FortiAI legt uit wat nodig is voor IoT-detectie en controleert of je FortiGates eraan voldoen."
      - ai: [0, 1]
      - tip: "Een voorwaardencheck waaruit blijkt dat niet alle FortiGates voldoen laat zien dat de uitkomst klopt en niet iets is wat FortiAI verzint."
      - text: "**Deel 2: VPN Assistant, configureren.** Kies **Select Devices** (of upload een topologie-afbeelding van maximaal 5 MB), controleer de samenvatting en bevestig."
      - ai: [2, 3]
      - tip: >
          Sla het script op met **Save Script** (Device Manager > Scripts). FortiAI zet de PSK als placeholder
          (`set psksecret <PLACEHOLDER_FOR_YOUR_PRESHARED_KEY>`): pas die zelf aan.
      - text: "**Deel 3: tunnels controleren en diagnosticeren.** Laat eerst een tunnel wegvallen:"
      - buttons:
          - {label: "WAN-A Utrecht down", action: {do: link, site: br1, transport: A, state: down}}
          - {label: "ISP-links", check: links}
          - {label: "Herstellen", action: {do: clear}}
      - ai: [4, 5, 6]
      - tip: >
          De status in VPN Monitor (Device Manager > Monitors > VPN Monitor, **Show Table**) toont alleen verkeer als de tunnel in gebruik is; zet hem
          eventueel handmatig omhoog met rechtermuisknop > **Bring Tunnel UP**.
      - text: "**Deel 4: Script Assistant met meta variables.** Genereer een CLI-script voor hostname en IP-adressen voor veel FortiGates tegelijk."
      - ai: [7, 8]
      - tip: "Sla op met **Save CLI Template** (Device Manager > Provisioning Templates > CLI Template)."
      - text: >
          **Wat je benadrukt:** in minuten een volledige template voor massale provisioning, VPN-configuratie met beeldherkenning van een topologie,
          en tunnels bewaken, diagnosticeren en herstellen. AI helpt het NOC, het vervangt niemand.

  - id: advpn
    title: "12. ADVPN 2.0: directe tunnels"
    summary: "Branches bouwen zelf shortcuts naar elkaar"
    steps:
      - text: >
          **Het idee.** Verkeer tussen twee branches gaat eerst via een hub. De hub herkent dat en laat de twee branches een **directe tunnel** (shortcut)
          opbouwen. Met **ADVPN 2.0** kiest SD-WAN zelf tussen de shortcut en de tunnels naar de hubs, op basis van de SLA van de peer
          (`advpn-select` op de overlay-zone met health-check `DC_SLA`). De shortcut verdwijnt weer als hij niet meer gebruikt wordt.
      - text: "**Ontwerp in dit lab.** De hubs sturen shortcut-aanbiedingen (`auto-discovery-sender`), de branches ontvangen ze. Tussen de hubs lopen aparte tunnels (`H2H-VPN1` en `H2H-VPN2`) met iBGP. De branches leren de LAN's van de andere branches rechtstreeks van beide hubs, met de andere branch zelf als next-hop; dat is wat shortcuts mogelijk maakt."
      - tip: >
          Bewust **niet** gebruikt: `next-hop-self-rr` op de hubs. Dat herschrijft de next-hop naar de hub en schakelt shortcuts uit.
      - text: "**Laten zien.** Eerst de tunnels van Utrecht in de normale situatie, dan verkeer naar Rotterdam, en daarna opnieuw de tunnels."
      - buttons:
          - {label: "1. Tunnels van Utrecht tonen", check: tunnels, device: FGT-BR1}
          - {label: "2. Ping Utrecht naar Rotterdam", action: {do: ping, site: br1, target: 10.12.0.50}}
          - {label: "3. Tunnels opnieuw tonen", check: tunnels, device: FGT-BR1}
      - image: fmg-vpnmonitor.jpg
        caption: "FortiManager > Device Manager > Monitors > VPN Monitor: de overlay tussen de branches (cluster in Nederland) en de hub in Frankfurt; shortcut-tunnels tussen branches verschijnen hier als extra verbindingen."
      - tip: >
          Op FGT-BR1 (Utrecht): `execute ping 10.12.0.50` naar Rotterdam, daarna `diagnose vpn tunnel list`. Naast `HUB1-VPN1` en de andere
          hub-tunnels verschijnt dan een shortcut zoals `HUB1-VPN1_0` met als eindpunt het underlay-adres van Rotterdam. In FortiManager zie je
          dezelfde tunnels onder VPN Manager.
      - text: "**Wat je benadrukt:** minder latency en minder belasting van de hubs voor verkeer tussen branches, zonder extra configuratie per branch: alles komt uit één overlay-template."
